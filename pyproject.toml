[project]
name = "temporaltidesluna"
version = "0.1.1"
description = "GUI for lejaren to compose for Temporal Tides project"
authors = [
    {name = "anstepp",email = "stepp.aaron@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "pytest (>=9.0.3,<10.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    # TODO: uncomment for PyPi release
    #"lejaren (>=1.0.0,<2.0.0)",
]

[tool.poetry.dependencies]
package-name = { git = "https://github.com", subdirectory = "./lejaren" }


[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
    "integration",
]

pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
